name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-thm-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest TryHackMe Badge
        run: |
          mkdir -p assets
          curl -s -L "https://tryhackme-badges.s3.amazonaws.com/Alex.nova.png" -o assets/tryhackme-badge.png

      - name: Commit and Push Updated Badge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tryhackme-badge.png
          if git diff --cached --quiet; then
            echo "No badge changes detected."
          else
            git commit -m "chore: auto-update TryHackMe badge"
            git push
          fi
